<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="370" fill="#0d1117" rx="12"/>
  <text x="360" y="35" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="bold">Anti-Stagnation Stack</text>
  <text x="360" y="56" text-anchor="middle" fill="#6e7681" font-size="12">Five layers that keep the model from going in circles</text>

  <rect x="40" y="72" width="640" height="50" rx="8" fill="#f8514915" stroke="#f85149" stroke-width="1.5"/>
  <text x="60" y="96" fill="#f85149" font-size="15" font-weight="bold">1. Phase Enforcement</text>
  <text x="60" y="114" fill="#8b949e" font-size="12">Nudge at 4 analysis calls, hard block at 9. Read the vuln, then write code.</text>

  <rect x="40" y="130" width="640" height="50" rx="8" fill="#d2960015" stroke="#d29600" stroke-width="1.5"/>
  <text x="60" y="154" fill="#d29600" font-size="15" font-weight="bold">2. Stagnation Detector</text>
  <text x="60" y="172" fill="#8b949e" font-size="12">Tracks calls since last finding. Pivot prompt at 15. Hard kill at 100.</text>

  <rect x="40" y="188" width="640" height="50" rx="8" fill="#388bfd15" stroke="#388bfd" stroke-width="1.5"/>
  <text x="60" y="212" fill="#388bfd" font-size="15" font-weight="bold">3. Repetition Detector</text>
  <text x="60" y="230" fill="#8b949e" font-size="12">Ring buffer of last 10 calls. Jaccard similarity at 0.85. Catches near-dupes.</text>

  <rect x="40" y="246" width="640" height="50" rx="8" fill="#2ea04315" stroke="#2ea043" stroke-width="1.5"/>
  <text x="60" y="270" fill="#2ea043" font-size="15" font-weight="bold">4. Tool Watchdog</text>
  <text x="60" y="288" fill="#8b949e" font-size="12">Polls in-flight calls every 5s. Detects hangs, triggers timeout and pivot.</text>

  <rect x="40" y="304" width="640" height="50" rx="8" fill="#a78bfa15" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="60" y="328" fill="#a78bfa" font-size="15" font-weight="bold">5. Context Monitor</text>
  <text x="60" y="346" fill="#8b949e" font-size="12">Tracks token usage across turns. Trims context before hitting limits.</text>
</svg>