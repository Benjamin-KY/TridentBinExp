  <rect x="160" y="42" width="18" height="24" rx="4" fill="#f85149"/>
  <text x="186" y="59" fill="#f85149" font-size="13" font-weight="bold">16</text>
  <text x="216" y="59" fill="#6e7681" font-size="11">on-target</text>

  <!-- Trident bar -->
  <rect x="160" y="122" width="465" height="24" rx="4" fill="#2ea043"/>
