<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="750" height="300" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="375" y="35" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="bold">On-Target Exploits: Vanilla vs Trident</text>
  <text x="375" y="54" text-anchor="middle" fill="#6e7681" font-size="11">Both using Claude Opus 4.6 — same model, same timeout, same safety guardrails</text>

  <!-- Row 1: Vanilla -->
  <text x="40" y="105" fill="#8b949e" font-size="13">Claude Code</text>
  <text x="40" y="122" fill="#6e7681" font-size="11">(vanilla agent)</text>

  <rect x="190" y="94" width="16" height="28" rx="4" fill="#f85149"/>
  <text x="216" y="114" fill="#f85149" font-size="15" font-weight="bold">16</text>

  <!-- Row 2: Trident -->
  <text x="40" y="185" fill="#f0f6fc" font-size="13" font-weight="bold">Trident</text>
  <text x="40" y="202" fill="#8b949e" font-size="11">(specialised harness)</text>

  <rect x="190" y="174" width="420" height="28" rx="4" fill="#2ea043"/>
  <text x="620" y="194" fill="#2ea043" font-size="15" font-weight="bold">209+</text>

  <!-- Scale ticks -->
  <line x1="190" y1="230" x2="190" y2="238" stroke="#30363d" stroke-width="1"/>
  <text x="190" y="252" text-anchor="middle" fill="#484f58" font-size="9">0</text>
  <line x1="290" y1="230" x2="290" y2="238" stroke="#30363d" stroke-width="1"/>
  <text x="290" y="252" text-anchor="middle" fill="#484f58" font-size="9">50</text>
  <line x1="390" y1="230" x2="390" y2="238" stroke="#30363d" stroke-width="1"/>
  <text x="390" y="252" text-anchor="middle" fill="#484f58" font-size="9">100</text>
  <line x1="490" y1="230" x2="490" y2="238" stroke="#30363d" stroke-width="1"/>
  <text x="490" y="252" text-anchor="middle" fill="#484f58" font-size="9">150</text>
  <line x1="590" y1="230" x2="590" y2="238" stroke="#30363d" stroke-width="1"/>
  <text x="590" y="252" text-anchor="middle" fill="#484f58" font-size="9">200</text>
  <line x1="190" y1="232" x2="610" y2="232" stroke="#30363d" stroke-width="0.5"/>

  <!-- 13x badge -->
  <rect x="560" y="90" width="100" height="46" rx="23" fill="#238636"/>
  <text x="610" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">13×</text>
  <text x="610" y="128" text-anchor="middle" fill="#d2fedb" font-size="10">uplift</text>

  <!-- Connecting lines from badge -->
  <path d="M560,113 L240,108" stroke="#238636" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.6"/>
  <path d="M610,136 L500,174" stroke="#238636" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- Footer -->
  <text x="375" y="280" text-anchor="middle" fill="#6e7681" font-size="10">Userspace tasks only — kernel and V8 results still running. The entire difference is agent engineering.</text>
</svg>