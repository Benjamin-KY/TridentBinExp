<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg)" rx="12"/>
  <text x="450" y="45" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Trident Architecture</text>

  <!-- ExploitGym Framework box -->
  <rect x="40" y="65" width="820" height="520" rx="10" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="90" fill="#8b949e" font-size="13">ExploitGym Evaluation Framework</text>

  <!-- Task Classifier -->
  <rect x="320" y="100" width="260" height="50" rx="8" fill="#21262d" stroke="#f0f6fc" stroke-width="1.5"/>
  <text x="450" y="130" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="bold">Task Type Classifier</text>

  <!-- Arrows from classifier -->
  <line x1="370" y1="150" x2="160" y2="200" stroke="#2ea043" stroke-width="2"/>
  <line x1="450" y1="150" x2="450" y2="200" stroke="#388bfd" stroke-width="2"/>
  <line x1="530" y1="150" x2="740" y2="200" stroke="#a78bfa" stroke-width="2"/>

  <!-- Userspace -->
  <rect x="60" y="200" width="220" height="180" rx="10" fill="#2ea04310" stroke="#2ea043" stroke-width="1.5"/>
  <text x="170" y="225" text-anchor="middle" fill="#2ea043" font-size="15" font-weight="bold">Userspace Tools</text>
  <text x="80" y="250" fill="#c9d1d9" font-size="12">check_binary (checksec)</text>
  <text x="80" y="270" fill="#c9d1d9" font-size="12">crash_analysis (core dumps)</text>
  <text x="80" y="290" fill="#c9d1d9" font-size="12">get_sections / get_symbols</text>
  <text x="80" y="310" fill="#c9d1d9" font-size="12">interact_with_binary</text>
  <text x="80" y="330" fill="#c9d1d9" font-size="12">bash / read_file / write_file</text>
  <text x="80" y="360" fill="#8b949e" font-size="11" font-style="italic">Prompt: Binary Exploitation</text>

  <!-- Kernel -->
  <rect x="310" y="200" width="260" height="180" rx="10" fill="#1f6feb10" stroke="#388bfd" stroke-width="1.5"/>
  <text x="440" y="225" text-anchor="middle" fill="#388bfd" font-size="15" font-weight="bold">Kernel Tools</text>
  <text x="330" y="250" fill="#c9d1d9" font-size="12">kernel_analyze (vuln + config)</text>
  <text x="330" y="270" fill="#c9d1d9" font-size="12">kernel_vm_cmd (serial console)</text>
  <text x="330" y="290" fill="#c9d1d9" font-size="12">kernel_upload_exploit (transfer</text>
  <text x="340" y="306" fill="#c9d1d9" font-size="12">+ compile + execute)</text>
  <text x="330" y="330" fill="#c9d1d9" font-size="12">bash / read_file / write_file</text>
  <text x="330" y="360" fill="#8b949e" font-size="11" font-style="italic">Prompt: Kernel Priv Escalation</text>

  <!-- V8 -->
  <rect x="610" y="200" width="220" height="180" rx="10" fill="#8b5cf610" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="720" y="225" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="bold">V8 Tools</text>
  <text x="630" y="250" fill="#c9d1d9" font-size="12">v8_analyze (patches + PoC)</text>
  <text x="630" y="270" fill="#c9d1d9" font-size="12">v8_send_exploit (deliver JS,</text>
  <text x="640" y="286" fill="#c9d1d9" font-size="12">detect crash, extract flag)</text>
  <text x="630" y="310" fill="#c9d1d9" font-size="12">bash / read_file / write_file</text>
  <text x="630" y="360" fill="#8b949e" font-size="11" font-style="italic">Prompt: V8 Engine Exploitation</text>

  <!-- Core Agent -->
  <rect x="200" y="420" width="500" height="80" rx="10" fill="#f8514910" stroke="#f85149" stroke-width="1.5"/>
  <text x="450" y="450" text-anchor="middle" fill="#f85149" font-size="16" font-weight="bold">Claude Opus 4.6 Agent</text>
  <text x="450" y="475" text-anchor="middle" fill="#c9d1d9" font-size="13">Single agent | Domain-aware prompts | Structured tool output</text>

  <!-- Arrows to agent -->
  <line x1="170" y1="380" x2="350" y2="420" stroke="#2ea043" stroke-width="1.5"/>
  <line x1="440" y1="380" x2="440" y2="420" stroke="#388bfd" stroke-width="1.5"/>
  <line x1="720" y1="380" x2="550" y2="420" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- Bottom: targets -->
  <rect x="100" y="535" width="160" height="40" rx="6" fill="#21262d" stroke="#2ea043" stroke-width="1"/>
  <text x="180" y="560" text-anchor="middle" fill="#c9d1d9" font-size="12">Binary Targets</text>

  <rect x="370" y="535" width="160" height="40" rx="6" fill="#21262d" stroke="#388bfd" stroke-width="1"/>
  <text x="450" y="560" text-anchor="middle" fill="#c9d1d9" font-size="12">QEMU VMs (kernel)</text>

  <rect x="640" y="535" width="160" height="40" rx="6" fill="#21262d" stroke="#a78bfa" stroke-width="1"/>
  <text x="720" y="560" text-anchor="middle" fill="#c9d1d9" font-size="12">V8 Containers</text>

  <line x1="350" y1="500" x2="180" y2="535" stroke="#30363d" stroke-width="1.5"/>
  <line x1="450" y1="500" x2="450" y2="535" stroke="#30363d" stroke-width="1.5"/>
  <line x1="550" y1="500" x2="720" y2="535" stroke="#30363d" stroke-width="1.5"/>

  <!-- 13x badge -->
  <rect x="720" y="440" width="120" height="45" rx="22" fill="#238636"/>
  <text x="780" y="460" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">13x uplift</text>
  <text x="780" y="476" text-anchor="middle" fill="#d2fedb" font-size="11">vs vanilla agent</text>
</svg>
