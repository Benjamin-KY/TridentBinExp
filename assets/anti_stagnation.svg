<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="340" fill="#0d1117" rx="12"/>
  <text x="350" y="30" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="bold">Anti-Stagnation Stack</text>
  <text x="350" y="50" text-anchor="middle" fill="#8b949e" font-size="11">Five layers that stop the model going in circles</text>

  <!-- Layer 1 -->
  <rect x="40" y="65" width="620" height="45" rx="8" fill="#f8514918" stroke="#f85149" stroke-width="1.5"/>
  <text x="55" y="83" fill="#f85149" font-size="12" font-weight="bold">1</text>
  <text x="75" y="83" fill="#f0f6fc" font-size="12" font-weight="bold">Phase Enforcement</text>
  <text x="75" y="100" fill="#8b949e" font-size="11">Soft nudge at 4 analysis calls, hard block at 9. Once you have read the vuln, write some code.</text>

  <!-- Layer 2 -->
  <rect x="40" y="118" width="620" height="45" rx="8" fill="#d2960018" stroke="#d29600" stroke-width="1.5"/>
  <text x="55" y="136" fill="#d29600" font-size="12" font-weight="bold">2</text>
  <text x="75" y="136" fill="#f0f6fc" font-size="12" font-weight="bold">Stagnation Detector</text>
  <text x="75" y="153" fill="#8b949e" font-size="11">Tracks calls since last finding. Pivot prompt at 15 with no progress. Hard kill at 100.</text>

  <!-- Layer 3 -->
  <rect x="40" y="171" width="620" height="45" rx="8" fill="#388bfd18" stroke="#388bfd" stroke-width="1.5"/>
  <text x="55" y="189" fill="#388bfd" font-size="12" font-weight="bold">3</text>
  <text x="75" y="189" fill="#f0f6fc" font-size="12" font-weight="bold">Repetition Detector</text>
  <text x="75" y="206" fill="#8b949e" font-size="11">Ring buffer of last 10 calls. Hash-exact + Jaccard similarity (0.85). Catches near-duplicate payloads.</text>

  <!-- Layer 4 -->
  <rect x="40" y="224" width="620" height="45" rx="8" fill="#2ea04318" stroke="#2ea043" stroke-width="1.5"/>
  <text x="55" y="242" fill="#2ea043" font-size="12" font-weight="bold">4</text>
  <text x="75" y="242" fill="#f0f6fc" font-size="12" font-weight="bold">Tool Watchdog</text>
  <text x="75" y="259" fill="#8b949e" font-size="11">Polls in-flight tool calls every 5s. Detects hangs, triggers timeout and pivot.</text>

  <!-- Layer 5 -->
  <rect x="40" y="277" width="620" height="45" rx="8" fill="#a78bfa18" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="55" y="295" fill="#a78bfa" font-size="12" font-weight="bold">5</text>
  <text x="75" y="295" fill="#f0f6fc" font-size="12" font-weight="bold">Context Monitor</text>
  <text x="75" y="312" fill="#8b949e" font-size="11">Tracks token usage across turns. Trims context before hitting limits. Keeps the window useful.</text>
</svg>